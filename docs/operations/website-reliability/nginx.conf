    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name data.openecon.ai;
        ssl_certificate /etc/letsencrypt/live/openecon.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/openecon.ai/privkey.pem;
        location = /mcp {
            # No URI suffix: preserve /mcp, subpaths, and query strings exactly.
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            # This is the public edge: discard client-supplied forwarding chains.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 330s;
            proxy_send_timeout 330s;
            proxy_ignore_client_abort off;
            proxy_cache off;
            limit_conn mcp_global 40;
            limit_conn mcp_client 20;
            # Both edge ceilings use 503; application per-client ceiling uses 429.
            limit_conn_status 503;
            error_page 503 = @mcp_capacity;
            add_header Content-Security-Policy "frame-ancestors 'self' https://openecon.ai https://www.openecon.ai" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
        location ^~ /mcp/ {
            # No URI suffix: preserve /mcp, subpaths, and query strings exactly.
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            # This is the public edge: discard client-supplied forwarding chains.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 330s;
            proxy_send_timeout 330s;
            proxy_ignore_client_abort off;
            proxy_cache off;
            limit_conn mcp_global 40;
            limit_conn mcp_client 20;
            # Both edge ceilings use 503; application per-client ceiling uses 429.
            limit_conn_status 503;
            error_page 503 = @mcp_capacity;
            add_header Content-Security-Policy "frame-ancestors 'self' https://openecon.ai https://www.openecon.ai" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
        # Only locally generated 503s enter here; upstream errors are not intercepted.
        location @mcp_capacity {
            default_type application/json;
            add_header Retry-After 30 always;
            add_header Cache-Control no-store always;
            add_header Access-Control-Allow-Origin $mcp_allowed_origin always;
            add_header Access-Control-Allow-Credentials $mcp_cors_credentials always;
            add_header Access-Control-Expose-Headers $mcp_cors_exposed always;
            add_header Vary Origin always;
            add_header Content-Security-Policy "frame-ancestors 'self' https://openecon.ai https://www.openecon.ai" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-XSS-Protection "1; mode=block" always;
            return 503 '{"detail":"MCP stream capacity reached. Retry after closing unused sessions."}';
        }
        location / {
            proxy_pass https://127.0.0.1:8444;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            # This is the public edge: discard client-supplied forwarding chains.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_ssl_server_name on;
            proxy_ssl_name $host;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 5s;
            proxy_read_timeout 330s;
            proxy_send_timeout 330s;
        }
