# Staged proposal. PRODUCTION CANDIDATE; not deployed by generator.
user www-data;
worker_processes auto;
# Retire old generations after allowing active requests to finish.
worker_shutdown_timeout 300s;
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    # Operating ceiling, not a benchmark or promise of backend capacity.
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 64;
    server_tokens off;
    # Apache 2.4.52 has no configured LimitRequestBody: avoid introducing 1MiB.
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    keepalive_timeout 65s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache shared:website_tls:10m;
    ssl_session_timeout 1d;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Empty keys do not consume slots: message POSTs remain independent.
    map "$request_method:$uri" $mcp_global_key {
        default "";
        ~^GET:/mcp/?$ mcp;
    }
    map "$request_method:$uri" $mcp_client_key {
        default "";
        ~^GET:/mcp/?$ $binary_remote_addr;
    }
    limit_conn_zone $mcp_global_key zone=mcp_global:1m;
    limit_conn_zone $mcp_client_key zone=mcp_client:1m;
    # Snapshot of the MCP service's effective CORS allowlist, reviewed with its settings.
    map $http_origin $mcp_allowed_origin {
        default "";
        "https://data.openecon.ai" $http_origin;
        "https://www.data.openecon.ai" $http_origin;
    }
    map $mcp_allowed_origin $mcp_cors_credentials {
        default true;
        "" "";
    }
    map $mcp_allowed_origin $mcp_cors_exposed {
        default "Retry-After";
        "" "";
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/hansearch.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hansearch.com/privkey.pem;
        return 444;
    }
    server {
        listen 80;
        listen [::]:80;
        server_name hansearch.com www.hansearch.com app.hansearch.com agent.hansearch.com n8n.hansearch.com luhan.io www.luhan.io luhanecon.com www.luhanecon.com jiaqili.io www.jiaqili.io jp.hansearch.com api.hansearch.com crypto.hansearch.com openecon.ai www.openecon.ai data.openecon.ai deepecon.ai www.deepecon.ai trade.hansearch.com;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            default_type text/plain;
            try_files $uri =404;
        }
        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Port 80;
            # This is the public edge: discard client-supplied forwarding chains.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name hansearch.com www.hansearch.com app.hansearch.com agent.hansearch.com n8n.hansearch.com luhan.io www.luhan.io luhanecon.com www.luhanecon.com jiaqili.io www.jiaqili.io;
        ssl_certificate /etc/letsencrypt/live/hansearch.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hansearch.com/privkey.pem;
        location / {
            proxy_pass https://127.0.0.1:8444;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
